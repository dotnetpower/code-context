[package]
name = "code-context"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
memchr = "2"
notify = "8"
globset = "0.4"
grep-regex = "0.1"
grep-matcher = "0.1"
regex-syntax = "0.8"
fs2 = "0.4"
libc = "0.2"
bincode = "1.3"

[[bin]]
name = "cctx"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
