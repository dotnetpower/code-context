[package]
name = "code-context"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast local code search, source reads, and smart context cache for AI coding agents."
repository = "https://github.com/dotnetpower/code-context"
homepage = "https://marketplace.visualstudio.com/items?itemName=dotnetpower.code-context-native"
keywords = ["mcp", "coding-agent", "code-search", "trigram-index", "copilot"]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
memchr = "2"
notify = "8"
globset = "0.4"
grep-regex = "0.1"
grep-matcher = "0.1"
regex-syntax = "0.8"
fs2 = "0.4"
libc = "0.2"
bincode = "1.3"

[[bin]]
name = "cctx"
path = "src/main.rs"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
